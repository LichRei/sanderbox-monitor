# .github/workflows/monitor.yml
name: Sanderbox monitor
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12      # permite processar picos; chamadas individuais mantêm timeout de 15s
    concurrency:
      group: sanderbox-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node monitor.mjs
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          # Fonte de verdade para as três rotas públicas; não depende de URL legada em secret.
          SANDERBOX_URL: https://sanderbox.online
          INGEST_URL: ${{ secrets.INGEST_URL }}
          METRICS_URL: ${{ secrets.METRICS_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
