# .github/workflows/monitor.yml
name: Sanderbox monitor
on:
  pull_request:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Testar acesso às fontes do Telegram em modo somente leitura"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.ref || 'sanderbox-monitor' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node monitor.mjs
        if: github.event_name != 'pull_request'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          # Fonte de verdade para as três rotas públicas; não depende de URL legada em secret.
          SANDERBOX_URL: https://sanderbox.online
          INGEST_URL: ${{ secrets.INGEST_URL }}
          METRICS_URL: ${{ secrets.METRICS_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          TELEGRAM_READ_ONLY: ${{ inputs.validate_only && '1' || '0' }}
